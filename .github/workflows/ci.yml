name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    # Two jobs in parallel: the fast tests with the checks, and the tests marked
    # slow (the documentation examples and the process-pool frontier sweeps).
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fast
            marker: not slow
            checks: true
          - suite: slow
            marker: slow
            checks: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync

    - name: Check code formatting with Black
      if: matrix.checks
      run: uv run python -m black --check cvxium/ test/

    - name: Lint with Ruff
      if: matrix.checks
      run: uv run python -m ruff check cvxium test

    - name: Type check with mypy
      if: matrix.checks
      run: uv run python -m mypy

    - name: Run tests with pytest
      run: uv run python -m pytest --verbose -m "${{ matrix.marker }}"
